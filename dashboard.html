
<!DOCTYPE html>
<html>
<head>
    <title>Campus Connect - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
    <div class="layout">
        <aside class="sidebar">
            <h2>Campus Connect</h2>
            <p>Admin Panel</p>
            <a href="dashboard.html" class="selected">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="courses.html">Courses</a>
            <a href="attendance.html">Attendance</a>
            <a href="reports.html">Reports</a>
            <button class="logoutBtn">Logout</button>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <h1>Admin Dashboard</h1>
                <p id="welcomeAdmin">Welcome Admin</p>
            </div>
            <h2>Overview</h2>
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Students</h3>
                    <h1 id="totalStudents">0</h1>
                </div>
                <div class="stat-card">
                    <h3>Total Courses</h3>
                    <h1 id="totalCourses">0</h1>
                </div>
                <div class="stat-card">
                    <h3>Attendance Records</h3>
                    <h1 id="totalAttendance">0</h1>
                </div>
            </div>
            <div class="content-box">
                <h2>Campus Connect</h2>
                <p>Manage students, courses and attendance from one place.</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
