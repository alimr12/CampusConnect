
<!DOCTYPE html>
<html>
<head>
    <title>Campus Connect - Students</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">

    <div class="layout">
        <aside class="sidebar">
            <h2>Campus Connect</h2>
            <p>Admin Panel</p>

            <a href="dashboard.html">Dashboard</a>
            <a href="students.html" class="selected">Students</a>
            <a href="courses.html">Courses</a>
            <a href="attendance.html">Attendance</a>
            <a href="reports.html">Reports</a>

            <button class="logoutBtn">Logout</button>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Student Management</h1>
            </div>

            <div class="content-box">
                <h2>Add Student</h2>

                <form id="studentForm" class="form-grid">
                    <input type="text" id="studentName" placeholder="Student Name" required>
                    <input type="email" id="studentEmail" placeholder="Student Email" required>
                    <input type="password" id="studentPassword" placeholder="Password" minlength="6" required>
                    <button type="submit" class="btn">Add Student</button>
                </form>

                <p id="studentMessage" class="message"></p>
            </div>

            <div class="content-box">
                <h2>All Students</h2>

                <input type="text" id="searchStudent" placeholder="Search by name or email">

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Registered Courses</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="studentList"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
