
<!DOCTYPE html>
<html>
<head>
    <title>Campus Connect - Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="student">
    <div class="layout">
        <aside class="sidebar">
            <h2>Campus Connect</h2>
            <p>Student Panel</p>
            <a href="student-dashboard.html" class="selected">Dashboard</a>
            <button class="logoutBtn">Logout</button>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <h1>Student Dashboard</h1>
                <p id="welcomeStudent">Welcome Student</p>
            </div>
            <div class="content-box">
                <h2>My Profile</h2>
                <p><strong>Name:</strong> <span id="studentName"></span></p>
                <p><strong>Email:</strong> <span id="studentEmail"></span></p>
            </div>
            <div class="content-box">
                <h2>Available Courses</h2>
                <p>Register for the courses you want to study.</p>
                <div id="studentCourses" class="course-grid"></div>
            </div>
            <div class="content-box">
                <h2>My Attendance</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Course</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="myAttendanceList"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
