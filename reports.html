
<!DOCTYPE html>
<html>
<head>
    <title>Campus Connect - Reports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
    <div class="layout">
        <aside class="sidebar">
            <h2>Campus Connect</h2>
            <p>Admin Panel</p>
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="courses.html">Courses</a>
            <a href="attendance.html">Attendance</a>
            <a href="reports.html" class="selected">Reports</a>
            <button class="logoutBtn">Logout</button>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <h1>Reports</h1>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Students</h3>
                    <h1 id="reportStudents">0</h1>
                </div>
                <div class="stat-card">
                    <h3>Total Courses</h3>
                    <h1 id="reportCourses">0</h1>
                </div>
                <div class="stat-card">
                    <h3>Present Records</h3>
                    <h1 id="reportPresent">0</h1>
                </div>
            </div>
            <div class="content-box">
                <h2>Attendance Report</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Course</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="reportList"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
