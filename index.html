
<!DOCTYPE html>
<html>
<head>
    <title>Campus Connect - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h1>Campus Connect</h1>
        <p>Student Management System</p>

        <div class="login-tabs">
            <button type="button" id="studentTab" class="active">Student</button>
            <button type="button" id="adminTab">Admin</button>
        </div>

        <form id="loginForm">
            <h2 id="loginTitle">Student Login</h2>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>
        </form>

        <div id="signupBox">
            <p>New student? <a href="#" id="signupLink">Create Account</a></p>
        </div>

        <form id="signupForm" class="hidden">
            <h2>Student Signup</h2>
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="signupEmail" placeholder="Email Address" required>
            <input type="password" id="signupPassword" placeholder="Create Password" required>
            <button type="submit" class="btn">Sign Up</button>
            <p><a href="#" id="loginLink">Back to Login</a></p>
        </form>

        <p id="message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
