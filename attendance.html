
<!DOCTYPE html>
<html>
<head>
    <title>Campus Connect - Attendance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
    <div class="layout">
        <aside class="sidebar">
            <h2>Campus Connect</h2>
            <p>Admin Panel</p>
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="courses.html">Courses</a>
            <a href="attendance.html" class="selected">Attendance</a>
            <a href="reports.html">Reports</a>
            <button class="logoutBtn">Logout</button>
        </aside>

        <main class="main">
            <div class="top">
                <div>
                    <h1>Attendance</h1>
                    <p>Record student attendance</p>
                </div>
                <div class="admin-icon">A</div>
            </div>

            <div class="panel">
                <h2>Mark Attendance</h2>
                <form id="attendanceForm" class="form-grid">
                    <select id="attendanceStudent" required>
                        <option value="">Select Student</option>
                    </select>
                    <select id="attendanceCourse" required>
                        <option value="">Select Course</option>
                    </select>
                    <select id="attendanceStatus" required>
                        <option value="">Select Status</option>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                    <button type="submit" class="btn">Save Attendance</button>
                </form>
                <p id="attendanceMessage"></p>
            </div>

            <div class="panel">
                <h2>Attendance Records</h2>
                <div class="table-box">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Course</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceList"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
